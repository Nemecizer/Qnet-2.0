# The Python package `qnet`: Qnet's command-line tool from a script or a notebook.
# Not published anywhere: install it from this folder (see README.md).
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qnet"
# The app's version: scripts/verify-version.mjs fails when this and qnet/__init__.py disagree with it.
version = "2.1.2"
description = "Build, solve and sweep queueing networks with Qnet from Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dr Joseph Edward Nemec" }]
# Standard library only. NumPy, pandas and matplotlib are used when they are installed.
dependencies = []

[tool.setuptools]
packages = ["qnet"]
